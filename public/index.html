<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Database-Driven Web App</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; margin-top: 50px; background-color: #0f172a; color: #f8fafc; }
        .container { max-width: 600px; margin: auto; padding: 20px; border: 1px solid #334155; border-radius: 8px; background-color: #1e293b; }
        h1 { color: #38bdf8; }
        p { font-size: 18px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Connected to PostgreSQL!</h1>
        <p>This page has been visited <span id="count">loading...</span> times.</p>
    </div>

    <script>
        fetch('/api/visits')
            .then(response => response.json())
            .then(data => {
                document.getElementById('count').textContent = data.totalVisits;
            })
            .catch(error => {
                console.error('Error fetching visit count:', error);
                document.getElementById('count').textContent = 'error';
            });
    </script>
</body>
</html>
